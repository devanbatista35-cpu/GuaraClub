<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GuaraClub – Cadastro</title>
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
  <div class="login">
    <div class="hero">
      <div class="sign">
        <img src="../images/logo_guara.jpg" alt="GuaraClub — comunidade Tech Brazil">
      </div>
    </div>
    <div class="panel">
      <div class="logo">
        <img src="../images/logo_guararedondo.jpeg" alt="Logo GuaraClub">
      </div>
      <h2>Crie Sua Conta</h2>
      <form action="home.html">
        <label>Nome</label>
        <input class="f" placeholder="Ex: Emily Helena" required>
        <label>Email</label>
        <input class="f" type="email" placeholder="Ex: emilyhelena@gmail.com" required>
        <label>Senha</label>
        <input class="f" type="password" placeholder="********" required>
        <label>Confirmação de Senha</label>
        <input class="f" type="password" placeholder="********" required>
        <button type="submit" class="go">CRIAR CONTA</button>
      </form>
      <a class="alt" href="../index.html">Já tem uma conta? Entrar</a>
      <div class="cp">
        © 2026 GuaraClub Tech. Todos os direitos reservados.<br>Developed by GuaraClub Tech
      </div>
    </div>
  </div>
</body>
</html>
